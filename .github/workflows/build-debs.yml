name: build-debs

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  deb:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qt_arch: gcc_64
          - os: ubuntu-24.04-arm
            qt_arch: linux_gcc_arm64
    steps:
      - uses: actions/checkout@v4
      - name: Resolve package version (sanitized tag or snapshot)
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ] && echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-snapshot.$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
          fi
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 libgl1-mesa-dev
      - name: Install Qt 6.10.2 (aqtinstall)
        run: |
          python3 -m pip install --upgrade aqtinstall
          aqt install-qt linux desktop 6.10.2 "$QT_ARCH" --outputdir "$HOME/Qt"
        env:
          QT_ARCH: ${{ matrix.qt_arch }}
      - name: Build all-in-one deb (assets + patched VKB + pinyin)
        env:
          QT_PREFIX: ${{ format('{0}/Qt/6.10.2/{1}', env.HOME, matrix.qt_arch) }}
        run: |
          chmod +x packaging/*.sh scripts/*.sh
          ./packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: droid-pc-keyboard-deb-${{ matrix.qt_arch }}
          path: dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.deb
